<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="azure-bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="azure-grad" x1="30" y1="30" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="50%" stop-color="#00a4ef"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="cloud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="180" height="180" rx="42" fill="url(#azure-bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Glowing Cloud Container -->
  <g filter="url(#cloud-glow)">
    <path d="M58 116 C46 116 36 106 36 94 C36 82.5 45 73 56.5 71.5 C60.5 54 75.5 42 94 42 C114 42 130 56.5 132.5 76 C143 78 150 87 150 97.5 C150 108 141.5 116 131 116 Z" 
          fill="none" stroke="url(#azure-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- CI/CD Pipeline Flow track -->
  <path d="M56 116 H130" stroke="url(#azure-grad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Pipeline Stage Nodes -->
  <circle cx="56" cy="116" r="7.5" fill="#0078d4" stroke="#ffffff" stroke-width="3"/>
  <circle cx="93" cy="116" r="8.5" fill="#00a4ef" stroke="#ffffff" stroke-width="3.5"/>
  <circle cx="130" cy="116" r="7.5" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>

  <!-- Arrow / CI/CD Deployment Flow -->
  <path d="M83 83 L93 72 L103 83" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M93 74 V95" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
</svg>